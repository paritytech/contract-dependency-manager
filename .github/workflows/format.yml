name: Format

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    format-ts:
        name: TypeScript & JSON
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Install dependencies
              run: pnpm install
            - name: Check formatting
              run: pnpm biome format .

    actionlint:
        name: Workflow lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # A workflow file with a YAML syntax error fails at *startup*:
            # GitHub creates no check run and no red X, so the breakage is
            # invisible on the PR. actionlint turns that class of error into
            # a visible failure here.
            - name: Run actionlint
              run: |
                  bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
                  ./actionlint -color

    format-rs:
        name: Rust
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            # Same targets as local `pnpm format:check`, so CI also covers the
            # template workspace at src/templates/shared-counter.
            - name: Check formatting
              run: |
                  cargo fmt --all -- --check
                  cargo fmt --all --manifest-path src/templates/shared-counter/Cargo.toml -- --check
