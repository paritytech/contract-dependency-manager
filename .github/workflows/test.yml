name: Test

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        # The template contracts and the cdm::import! consumer track floating
        # `branch = "main"` git pins (pvm-contract-sdk), so upstream can break
        # them without any activity in this repo. A nightly run catches that
        # drift the day it happens instead of on the next fresh `bootstrap`.
        - cron: "17 3 * * *"

jobs:
    ts:
        name: TypeScript
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.2.x"
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            # The CLI imports build-time generated template embeds (gitignored),
            # so they must exist before typechecking or running the CLI tests.
            - name: Embed CLI templates
              run: pnpm embed:templates
            - name: Typecheck
              run: pnpm typecheck
            - name: Run tests
              run: pnpm vitest run

    rust:
        name: Rust
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rust-src
            # Same command as local `pnpm test:rust`, inlined because this job
            # has no Node/pnpm setup. The root .cargo/config.toml pins the
            # default target to PolkaVM, so an explicit host target is required.
            - name: Run host-side tests
              run: |
                  cargo test -p cdm-macros -p pvm-cdm -p pvm-cdm-macros -p contract-registry-core -p contract-registry -p contract-registry-proxy -p create3-factory -p create3-child --target "$(rustc -vV | sed -n 's/^host: //p')"

    templates:
        name: Templates
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            # Template contracts build with build-std against the PolkaVM JSON
            # target (see .cargo/config.toml), which needs nightly + rust-src.
            - uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rust-src
            # cargo-pvm-contract is a floating git pin (branch = "main"), so
            # resolve the current upstream revision up front and key every
            # cache on it: any upstream change invalidates the installed
            # binary and build caches together.
            - name: Resolve cargo-pvm-contract revision
              id: pvm-rev
              run: |
                  rev="$(git ls-remote https://github.com/paritytech/cargo-pvm-contract.git refs/heads/main | cut -f1)"
                  echo "rev=${rev}" >> "$GITHUB_OUTPUT"
            - name: Cache cargo-pvm-contract binary
              id: cache-pvm-bin
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/bin/cargo-pvm-contract
                  key: cargo-pvm-contract-${{ runner.os }}-${{ steps.pvm-rev.outputs.rev }}
            - name: Cache cargo dependencies and template build artifacts
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                      src/lib/cdm/import-test/target
                      src/templates/shared-counter/target
                      src/templates/instagram/target
                  key: templates-cargo-${{ runner.os }}-${{ steps.pvm-rev.outputs.rev }}-${{ hashFiles('src/templates/**/Cargo.toml', 'src/lib/cdm/**/Cargo.toml', 'src/contract/**/Cargo.toml') }}
                  restore-keys: |
                      templates-cargo-${{ runner.os }}-${{ steps.pvm-rev.outputs.rev }}-
                      templates-cargo-${{ runner.os }}-
            # Same install steps/flags as `cdm setup` (src/apps/cli/src/lib/toolchain.ts):
            # shallow-fetch the resolved revision, then `cargo install` with an
            # explicit host target because the root .cargo/config.toml pins the
            # default build target to PolkaVM. The binary is built with the
            # stable toolchain upstream pins in its rust-toolchain.toml: its
            # locked trie-db 0.30.0 no longer compiles on current nightly.
            - name: Install cargo-pvm-contract
              if: steps.cache-pvm-bin.outputs.cache-hit != 'true'
              run: |
                  tmp_dir="$(mktemp -d)"
                  git init -q "$tmp_dir"
                  git -C "$tmp_dir" remote add origin https://github.com/paritytech/cargo-pvm-contract.git
                  git -C "$tmp_dir" fetch -q --depth 1 origin "${{ steps.pvm-rev.outputs.rev }}"
                  git -C "$tmp_dir" checkout -q FETCH_HEAD
                  toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' "$tmp_dir/rust-toolchain.toml")"
                  rustup toolchain install "$toolchain" --profile minimal
                  host_target="$(rustc -vV | awk '/^host:/ { print $2 }')"
                  cargo "+$toolchain" install --force --locked --target "$host_target" --path "$tmp_dir/crates/cargo-pvm-contract"
            - name: Compile cdm::import! consumer to PolkaVM
              run: pnpm test:macro
            - name: Build template contracts
              run: pnpm build:template
            # Build the registry contracts and prove the embedded TS ABI
            # matches the generated one — the drift test self-skips when the
            # artifacts are missing, so it only has teeth right here.
            - name: Build registry contracts
              run: pnpm build:registry
            - name: Check embedded registry ABI against generated ABI
              run: pnpm vitest run src/lib/contracts/tests/registry-abi-sync.test.ts

    e2e:
        name: E2E
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.2.x"
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            # Registry contracts build with build-std against the PolkaVM JSON
            # target (see .cargo/config.toml), which needs nightly + rust-src.
            - uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rust-src
            - name: Resolve cargo-pvm-contract revision
              id: pvm-rev
              run: |
                  rev="$(git ls-remote https://github.com/paritytech/cargo-pvm-contract.git refs/heads/main | cut -f1)"
                  echo "rev=${rev}" >> "$GITHUB_OUTPUT"
            - name: Cache cargo-pvm-contract binary
              id: cache-pvm-bin
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/bin/cargo-pvm-contract
                  key: cargo-pvm-contract-${{ runner.os }}-${{ steps.pvm-rev.outputs.rev }}
            - name: Cache cargo dependencies and registry build artifacts
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: e2e-cargo-${{ runner.os }}-${{ steps.pvm-rev.outputs.rev }}-${{ hashFiles('src/contract/**/Cargo.toml') }}
                  restore-keys: |
                      e2e-cargo-${{ runner.os }}-
                      templates-cargo-${{ runner.os }}-
            - name: Install cargo-pvm-contract
              if: steps.cache-pvm-bin.outputs.cache-hit != 'true'
              run: |
                  tmp_dir="$(mktemp -d)"
                  git init -q "$tmp_dir"
                  git -C "$tmp_dir" remote add origin https://github.com/paritytech/cargo-pvm-contract.git
                  git -C "$tmp_dir" fetch -q --depth 1 origin "${{ steps.pvm-rev.outputs.rev }}"
                  git -C "$tmp_dir" checkout -q FETCH_HEAD
                  toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' "$tmp_dir/rust-toolchain.toml")"
                  rustup toolchain install "$toolchain" --profile minimal
                  host_target="$(rustc -vV | awk '/^host:/ { print $2 }')"
                  cargo "+$toolchain" install --force --locked --target "$host_target" --path "$tmp_dir/crates/cargo-pvm-contract"
            - name: Build registry contracts
              run: pnpm build:registry
            # The suite runs against a full local product environment (relay +
            # Asset Hub + Bulletin + IPFS gateway) that @parity/ppn spawns from
            # prebuilt binaries. The version is resolved up front so the binary
            # cache can be keyed on it.
            - name: Resolve @parity/ppn version
              id: ppn-version
              run: echo "version=$(npm view @parity/ppn version)" >> "$GITHUB_OUTPUT"
            - name: Install @parity/ppn
              run: npm install -g "@parity/ppn@${{ steps.ppn-version.outputs.version }}"
            # ~/.ppn/bin is the ~500 MB a first start downloads; .ipfs inside
            # it is per-run state that ppn recreates.
            - name: Cache PPN binaries
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.ppn/bin
                      !~/.ppn/bin/.ipfs
                  key: ppn-bin-${{ runner.os }}-${{ steps.ppn-version.outputs.version }}
            # GitHub throttles anonymous release downloads; the default Actions
            # token lifts that.
            - name: Start ephemeral PPN
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  ppn start --ephemeral > "$RUNNER_TEMP/ppn-start.log" 2>&1 &
                  ppn_pid=$!
                  # TCP-open is enough here — the harness re-probes RPC readiness.
                  # A warm cache boots in under a minute; the first run downloads
                  # ~500 MB of binaries first.
                  for i in $(seq 1 600); do
                      if nc -z 127.0.0.1 10020 10030 8080 2>/dev/null; then
                          echo "PPN ready after ${i}s"
                          exit 0
                      fi
                      if ! kill -0 "$ppn_pid" 2>/dev/null; then
                          echo "ppn start exited; last log lines:" >&2
                          tail -50 "$RUNNER_TEMP/ppn-start.log" >&2
                          exit 1
                      fi
                      sleep 1
                  done
                  echo "PPN did not become ready; last log lines:" >&2
                  tail -50 "$RUNNER_TEMP/ppn-start.log" >&2
                  exit 1
            - name: Run e2e suite
              run: pnpm test:e2e
            - name: Stop PPN
              if: always()
              run: ppn kill || true
            # An ephemeral run keeps node logs in zombienet's temp dir, not
            # ~/.ppn/data.
            - name: Upload PPN logs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-ppn-logs
                  path: |
                      ${{ runner.temp }}/ppn-start.log
                      ~/.ppn/data/**/*.log
                      /tmp/zombie-*/**/*.log
                  if-no-files-found: warn
