[package]
name = "counter"
version.workspace = true
edition.workspace = true
description = "Shared counter contract that holds on-chain state, exposing increment and read methods via CDM"
authors.workspace = true
homepage.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "counter"
path = "lib.rs"

# One [[bin]] per initialization: `initializations/X.Y.Z.rs` runs exactly once
# when version X.Y.Z is published (see the CDM "Initializations" docs).
[[bin]]
name = "counter-init-0-1-0"
path = "initializations/0.1.0.rs"

[features]
abi-gen = ["pvm-contract-sdk/abi-gen"]

[package.metadata.cdm]
package = "@example/counter"

[dependencies]
pvm-contract-sdk = { workspace = true }
polkavm-derive = { workspace = true }
picoalloc = { workspace = true }
