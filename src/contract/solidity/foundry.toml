[profile.default]
src = "src"
test = "test"
out = "out"
solc = "0.8.34"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Byte-identical output for identical source: no metadata hash appended.
bytecode_hash = "none"
cbor_metadata = false
# Tests pin the registry's shim code hash to the frozen blob.
fs_permissions = [{ access = "read", path = "../proxy/artifacts" }]
