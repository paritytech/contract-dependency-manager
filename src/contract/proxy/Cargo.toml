[package]
name = "contract-proxy"
description = "Per-name CDM shim: owns a contract name's permanent address and storage; every call is routed by the shared resolver"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
abi-gen = ["pvm-contract-sdk/abi-gen"]

[dependencies]
contract-registry-core = { path = "../core" }
pvm-contract-sdk.workspace = true
polkavm-derive.workspace = true
pvm-bump-allocator.workspace = true

[dev-dependencies]
pvm-contract-sdk = { workspace = true, features = ["std"] }
