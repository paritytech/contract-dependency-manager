[package]
name = "contract-proxy"
description = "Per-name CDM shim: owns a contract name's permanent address and storage; serves the latest version itself and asks the shared resolver about everything else"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
contract-host = { path = "../host" }
contract-registry-core = { path = "../core" }
polkavm-derive.workspace = true

[dev-dependencies]
contract-host = { path = "../host", features = ["mock"] }
pvm-contract-sdk = { workspace = true, features = ["std"] }
