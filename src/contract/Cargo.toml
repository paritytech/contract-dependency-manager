[package]
name = "contract-registry"
description = "On-chain CDM contract registry (implementation contract, served through contract-registry-proxy)"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
abi-gen = ["pvm-contract-sdk/abi-gen"]

[dependencies]
contract-registry-core = { path = "core" }
pvm-contract-sdk.workspace = true
polkavm-derive.workspace = true
picoalloc.workspace = true

# `std` (and thus `MockHost`) is enabled only for host-side unit tests, never
# for the release contract build, so the deployed binary stays no_std.
[dev-dependencies]
pvm-contract-sdk = { workspace = true, features = ["std"] }
