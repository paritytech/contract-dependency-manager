<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="460" viewBox="0 0 1220 460" role="img" aria-label="CDM publish and install flow: a producer's contract goes through cdm deploy to the on-chain Registry and Bulletin, and a consumer's cdm install fetches it back as a bundled address and ABI.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <!-- document stack: three pages with folded corners -->
    <g id="docstack">
      <g transform="translate(-20,-18)">
        <path d="M0 0 h44 l14 14 v62 h-58 z" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
        <path d="M44 0 v14 h14 z" fill="#e2e8f0" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <g transform="translate(-10,-9)">
        <path d="M0 0 h44 l14 14 v62 h-58 z" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
        <path d="M44 0 v14 h14 z" fill="#e2e8f0" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <g>
        <path d="M0 0 h44 l14 14 v62 h-58 z" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
        <path d="M44 0 v14 h14 z" fill="#e2e8f0" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
        <line x1="10" y1="30" x2="48" y2="30" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="10" y1="42" x2="48" y2="42" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="10" y1="54" x2="36" y2="54" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
  </defs>

  <!-- section headers -->
  <text x="235" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="middle">Contract Producer</text>
  <text x="960" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="middle">Contract Consumer</text>

  <!-- producer docs -->
  <use href="#docstack" x="82" y="168"/>
  <text x="107" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#334155" text-anchor="middle">@org/foo contract</text>

  <!-- producer docs -> cdm deploy -->
  <line x1="164" y1="210" x2="240" y2="210" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- cdm deploy -->
  <rect x="248" y="182" width="172" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.2"/>
  <text x="334" y="217" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#92400e" text-anchor="middle">cdm deploy</text>

  <!-- deploy -> on chain -->
  <line x1="428" y1="210" x2="484" y2="210" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="457" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">publish</text>

  <!-- on chain boundary -->
  <rect x="494" y="120" width="276" height="292" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="632" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#475569" text-anchor="middle">On Chain</text>

  <!-- registry -->
  <rect x="516" y="170" width="232" height="80" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="632" y="203" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Registry (Asset Hub)</text>
  <text x="632" y="230" font-family="Menlo, Consolas, monospace" font-size="12" fill="#334155" text-anchor="middle">"@org/foo" &#8594; address, cid</text>

  <!-- registry -> bulletin (cid) -->
  <line x1="632" y1="254" x2="632" y2="306" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowDashed)"/>
  <text x="646" y="285" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">cid</text>

  <!-- bulletin -->
  <rect x="516" y="312" width="232" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="632" y="345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#4c1d95" text-anchor="middle">Bulletin</text>
  <text x="632" y="372" font-family="Menlo, Consolas, monospace" font-size="12" fill="#334155" text-anchor="middle">cid &#8594; metadata + ABI</text>

  <!-- on chain -> cdm install -->
  <line x1="780" y1="210" x2="836" y2="210" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="808" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">fetch</text>

  <!-- cdm install -->
  <rect x="844" y="182" width="172" height="56" rx="10" fill="#d1fae5" stroke="#047857" stroke-width="2.2"/>
  <text x="930" y="217" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#065f46" text-anchor="middle">cdm install</text>

  <!-- cdm install -> consumer docs -->
  <line x1="1024" y1="210" x2="1078" y2="210" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- consumer docs -->
  <use href="#docstack" x="1102" y="168"/>
  <text x="1127" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#334155" text-anchor="middle">@org/foo bundled</text>
  <text x="1127" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#334155" text-anchor="middle">address + abi</text>
</svg>
