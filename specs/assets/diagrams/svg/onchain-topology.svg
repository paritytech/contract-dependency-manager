<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-label="On-chain topology: on Asset Hub, a CREATE3 factory deploys the ContractRegistry proxy, which delegate-calls swappable registry logic and writes routing to the resolver proxy, which delegate-calls swappable resolver logic; the registry creates one shim per name, every shim asks the resolver, and each name's version implementations are separate contracts. Metadata lives on Bulletin.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Asset Hub boundary -->
  <rect x="40" y="50" width="760" height="520" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="420" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">Asset Hub</text>

  <!-- factory -->
  <rect x="70" y="110" width="150" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="145" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">CREATE3 factory</text>
  <line x1="220" y1="135" x2="296" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="258" y="123" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">deploys</text>

  <!-- registry proxy -->
  <rect x="300" y="100" width="240" height="80" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="420" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">ContractRegistry</text>
  <text x="420" y="157" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#334155" text-anchor="middle">0x59b0&#8230; &#8212; stable address</text>

  <!-- registry logic -->
  <rect x="600" y="100" width="160" height="80" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="680" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#134e4a" text-anchor="middle">registry logic</text>
  <text x="680" y="157" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">swappable &#8212; setCode</text>

  <line x1="540" y1="140" x2="596" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="568" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="4">delegatecall</text>

  <!-- registry writes routing to the resolver -->
  <line x1="420" y1="180" x2="420" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="432" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">writes routing</text>

  <!-- resolver proxy -->
  <rect x="300" y="224" width="240" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="420" y="251" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">resolver</text>
  <text x="420" y="272" font-family="Menlo, Consolas, monospace" font-size="10" fill="#334155" text-anchor="middle">0x7f3A&#8230; &#8212; stable address</text>

  <!-- resolver logic -->
  <rect x="600" y="224" width="160" height="64" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="680" y="251" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">resolver logic</text>
  <text x="680" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">swappable &#8212; upgradeResolver</text>

  <line x1="540" y1="256" x2="596" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="568" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="4">delegatecall</text>

  <!-- registry creates the shims -->
  <path d="M 300 168 H 120 V 376" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">creates</text>
  <text x="110" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">one shim per name</text>

  <!-- every shim asks the resolver -->
  <line x1="190" y1="376" x2="364" y2="292" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="376" x2="420" y2="292" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="376" x2="476" y2="292" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5">resolve &#8212; every call asks the resolver</text>

  <!-- per-name shims -->
  <rect x="60" y="380" width="220" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.2"/>
  <text x="170" y="407" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">@org/foo</text>
  <text x="170" y="428" font-family="Menlo, Consolas, monospace" font-size="10" fill="#475569" text-anchor="middle">0x5A31&#8230; permanent</text>

  <rect x="310" y="380" width="220" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.2"/>
  <text x="420" y="407" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">@org/bar</text>
  <text x="420" y="428" font-family="Menlo, Consolas, monospace" font-size="10" fill="#475569" text-anchor="middle">0x77Aa&#8230; permanent</text>

  <rect x="560" y="380" width="220" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.2"/>
  <text x="670" y="407" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">@acme/baz</text>
  <text x="670" y="428" font-family="Menlo, Consolas, monospace" font-size="10" fill="#475569" text-anchor="middle">0x08cD&#8230; permanent</text>

  <!-- version impl chips -->
  <line x1="137" y1="444" x2="137" y2="476" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="203" y1="444" x2="203" y2="476" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="108" y="478" width="58" height="22" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="137" y="493" font-family="Menlo, Consolas, monospace" font-size="10" fill="#134e4a" text-anchor="middle">1.0.0</text>
  <rect x="174" y="478" width="58" height="22" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="203" y="493" font-family="Menlo, Consolas, monospace" font-size="10" fill="#134e4a" text-anchor="middle">2.0.0</text>

  <line x1="420" y1="444" x2="420" y2="476" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="391" y="478" width="58" height="22" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="420" y="493" font-family="Menlo, Consolas, monospace" font-size="10" fill="#134e4a" text-anchor="middle">0.4.2</text>

  <line x1="637" y1="444" x2="637" y2="476" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="703" y1="444" x2="703" y2="476" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="608" y="478" width="58" height="22" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="637" y="493" font-family="Menlo, Consolas, monospace" font-size="10" fill="#134e4a" text-anchor="middle">3.0.0</text>
  <rect x="674" y="478" width="58" height="22" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="703" y="493" font-family="Menlo, Consolas, monospace" font-size="10" fill="#134e4a" text-anchor="middle">3.1.0</text>

  <text x="420" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">version implementations &#8212; separate contracts, delegate-called by the shim</text>

  <!-- Bulletin -->
  <rect x="860" y="100" width="220" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="970" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#4c1d95" text-anchor="middle">Bulletin</text>
  <text x="970" y="157" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#334155" text-anchor="middle">cid &#8594; metadata + ABI</text>
  <text x="970" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">the registry stores each version&#8217;s cid</text>
</svg>
