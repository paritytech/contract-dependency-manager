<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="Storage model: every version's code delegate-calls into the per-name proxy and runs against its single shared state and balance. Code changes, state stays.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- per-name proxy -->
  <rect x="80" y="100" width="360" height="280" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.2"/>
  <text x="260" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#3730a3" text-anchor="middle">@org/foo proxy</text>
  <text x="260" y="160" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#475569" text-anchor="middle">0x5A31&#8230;9c4e</text>

  <!-- storage cylinder -->
  <path d="M 170 216 V 316 A 90 16 0 0 0 350 316 V 216" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="260" cy="216" rx="90" ry="16" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="260" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">state &#38; balance</text>

  <!-- version code boxes -->
  <rect x="620" y="108" width="300" height="54" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="770" y="141" font-family="Menlo, Consolas, monospace" font-size="13" fill="#134e4a" text-anchor="middle">v2.0.0 code</text>

  <rect x="620" y="196" width="300" height="54" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="770" y="229" font-family="Menlo, Consolas, monospace" font-size="13" fill="#134e4a" text-anchor="middle">v1.1.0 code</text>

  <rect x="620" y="284" width="300" height="54" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="770" y="317" font-family="Menlo, Consolas, monospace" font-size="13" fill="#134e4a" text-anchor="middle">v1.0.0 code</text>

  <!-- arrows into storage -->
  <line x1="616" y1="135" x2="362" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="616" y1="223" x2="366" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="616" y1="311" x2="362" y2="276" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">delegatecall</text>

  <!-- caption -->
  <text x="500" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748b" text-anchor="middle">code changes &#8212; state stays.</text>
</svg>
