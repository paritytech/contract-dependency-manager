[workspace]
resolver = "2"
members = [
    "src/contract",
    "src/contract/core",
    "src/contract/create3/child",
    "src/contract/create3/factory",
    "src/contract/proxy",
    "src/lib/cdm/rust",
    "src/lib/cdm/rust-macros",
    "src/lib/cdm/rust-macros/pvm-cdm",
    "src/lib/cdm/rust-macros/pvm-cdm-macros",
    "src/lib/cdm/import-test",
]

[workspace.package]
version = "0.1.0"
authors = ["Parity Technologies"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/paritytech/contract-dependency-manager"

[workspace.dependencies]
# Pinned to a known-good revision: upstream `main` has moved past this, and
# its storage-nesting rewrite (#133) removed `Mapping::view`/`view_mut`, which
# `src/contract` still uses. Keep this in sync with the CLI's
# DEFAULT_CARGO_PVM_CONTRACT_REF (src/apps/cli/src/lib/toolchain.ts) and the
# template Cargo.tomls.
pvm-contract-sdk = { git = "https://github.com/paritytech/cargo-pvm-contract", rev = "6400a32d1cbf15ab332e25352786504b7289660b", features = ["alloc"] }
pvm-cdm = { path = "src/lib/cdm/rust-macros/pvm-cdm" }
polkavm-derive = "0.35"
picoalloc = "5.2"
cdm = { path = "src/lib/cdm/rust" }
cdm-macros = { path = "src/lib/cdm/rust-macros" }
syn = "2"
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keccak-const = "0.2"
